set  -g default-terminal "tmux-256color"
set  -g base-index      1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys   vi

set  -g mouse             on
set  -g focus-events      off
setw -g aggressive-resize off
setw -g clock-mode-style  12
set  -s escape-time       10
set  -g history-limit     10000

# Enable extended key reporting for modified Enter keys
set -g extended-keys on
set -g extended-keys-format csi-u

# Set the prefix to `ctrl + q` instead of `ctrl + b`
set -g prefix C-q
unbind C-b

# Use | and - to split a window vertically and horizontally instead of " and % respectively
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Bind Arrow keys to resize the window
bind -n S-Down resize-pane -D 8
bind -n S-Up resize-pane -U 8
bind -n S-Left resize-pane -L 8
bind -n S-Right resize-pane -R 8

# Rename window with prefix + r
bind r command-prompt -I "#W" "rename-window '%%'"

# Reload tmux config by pressing prefix + R
bind R source-file ~/.config/tmux/tmux.conf \; display "TMUX Conf Reloaded"

# Clear screen with prefix + l
bind C-l send-keys 'C-l'

# Open a project in a separate window (disabled)
# bind-key -n C-f run-shell "tmux new-window -t 10 -n project-selector cd-to-project"

# Enable focus-events
set -g focus-events on

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf|atuin)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'if-shell "[ #{window_panes} -gt 1 ]" "select-pane -R" "send-keys C-l"'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

set-option -g renumber-windows on

# Refresh status-line time periodically
set -g status-interval 2

# Tmux behavior and status-line layout are owned by this personal configuration.
# Everforest color values and color-only styles come from the theme module.
set -as terminal-features ',xterm-256color:RGB'
set -g status on

set -g status-left-style none
set -g status-left-length 60
set -g status-left '#[fg=#{@everforest_bg_dim},bg=#{@everforest_green},bold] #S #[fg=#{@everforest_green},bg=#{@everforest_bg2},nobold]#[fg=#{@everforest_green},bg=#{@everforest_bg2},bold] #(whoami) #[fg=#{@everforest_bg2},bg=#{@everforest_bg0},nobold]'

set -g status-right-style none
set -g status-right-length 150
set -g status-right '#[fg=#{@everforest_aqua}]#[fg=#{@everforest_bg_dim},bg=#{@everforest_aqua},bold] #h '

set -g window-status-separator '#[fg=#{@everforest_grey2},bg=#{@everforest_bg0}] '
set -g window-status-format '#[fg=#{@everforest_grey0},bg=#{@everforest_bg0}] #I  #[fg=#{@everforest_grey0},bg=#{@everforest_bg0}]#W '
set -g window-status-current-format '#[fg=#{@everforest_bg0},bg=#{@everforest_bg_green}]#[fg=#{@everforest_fg},bg=#{@everforest_bg_green}] #I  #[fg=#{@everforest_fg},bg=#{@everforest_bg_green},bold]#W #[fg=#{@everforest_bg_green},bg=#{@everforest_bg0},nobold]'

# Everforest Tmux colors
set -g @everforest_aqua '#83c092'
set -g @everforest_bg0 '#272e33'
set -g @everforest_bg1 '#2e383c'
set -g @everforest_bg2 '#374145'
set -g @everforest_bg3 '#414b50'
set -g @everforest_bg4 '#495156'
set -g @everforest_bg5 '#4f5b58'
set -g @everforest_bg_blue '#384b55'
set -g @everforest_bg_dim '#1e2326'
set -g @everforest_bg_green '#3c4841'
set -g @everforest_bg_purple '#463f48'
set -g @everforest_bg_red '#493b40'
set -g @everforest_bg_visual '#4c3743'
set -g @everforest_bg_yellow '#45443c'
set -g @everforest_blue '#7fbbb3'
set -g @everforest_fg '#d3c6aa'
set -g @everforest_green '#a7c080'
set -g @everforest_grey0 '#7a8478'
set -g @everforest_grey1 '#859289'
set -g @everforest_grey2 '#9da9a0'
set -g @everforest_orange '#e69875'
set -g @everforest_purple '#d699b6'
set -g @everforest_red '#e67e80'
set -g @everforest_statusline1 '#a7c080'
set -g @everforest_statusline2 '#d3c6aa'
set -g @everforest_statusline3 '#e67e80'
set -g @everforest_yellow '#dbbc7f'

set -g status-style "fg=#{@everforest_fg},bg=#{@everforest_bg_dim},default"
set -g mode-style "fg=#{@everforest_purple},bg=#{@everforest_bg_visual}"

set -g window-status-style "fg=#{@everforest_grey1},bg=#{@everforest_bg0}"
set -g window-status-current-style "fg=#{@everforest_fg},bg=#{@everforest_bg_green}"
set -g window-status-activity-style "fg=#{@everforest_yellow},bg=#{@everforest_bg1}"
set -g window-status-bell-style "fg=#{@everforest_bg0},bg=#{@everforest_statusline3}"

set -g pane-border-style "fg=#{@everforest_grey1}"
set -g pane-active-border-style "fg=#{@everforest_blue}"
set -g display-panes-colour "#e69875"
set -g display-panes-active-colour "#7fbbb3"

set -g message-style "fg=#{@everforest_statusline3},bg=#{@everforest_bg_dim}"
set -g message-command-style "fg=#{@everforest_fg},bg=#{@everforest_bg1}"
set -g clock-mode-colour "#7fbbb3"
