"$schema" = "https://starship.rs/config-schema.json"
add_newline = false
format = "$directory$os$git_branch$git_status$nodejs$rust$golang$php $character"
palette = "everforest"

[character]
error_symbol = "[❯](statusline3)"
success_symbol = "[❯](statusline2)"
vimcmd_symbol = "[❮](statusline2)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
read_only_style = "orange"
style = "aqua"
truncate_to_repo = true
truncation_length = 4

[git_branch]
format = "[$symbol $branch](bold blue) "
symbol = ""

[git_status]
ahead = "[⇡$count ](bold green)"
behind = "[⇣$count ](bold green)"
conflicted = "[⚡$count ](bold red)"
deleted = "[✘$count ](bold red)"
diverged = "[⇡$ahead_count⇣$behind_count ](bold blue)"
format = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
modified = "[●$count ](bold purple)"
staged = "[+$count ](bold purple)"
untracked = "[?$count ](bold yellow)"

[golang]
format = "[$symbol $version](grey1) "
symbol = ""

[nodejs]
format = "[$symbol $version](grey1) "
symbol = ""

[os]
disabled = false
format = "[$symbol]($style) "
style = "grey2"

[os.symbols]
Alpine = ""
Arch = "󰣇"
Artix = "󰣇"
CachyOS = "󰣇"
Debian = ""
Macos = ""
Ubuntu = "󰕈"

[palettes.everforest]
accent = "#a7c080"
aqua = "#83c092"
black = "#7a8478"
blue = "#7fbbb3"
bright-black = "#859289"
bright-blue = "#7fbbb3"
bright-cyan = "#83c092"
bright-green = "#a7c080"
bright-purple = "#d699b6"
bright-red = "#e67e80"
bright-white = "#d3c6aa"
bright-yellow = "#dbbc7f"
cyan = "#83c092"
error = "#e67e80"
green = "#a7c080"
info = "#7fbbb3"
muted = "#859289"
orange = "#e69875"
purple = "#d699b6"
red = "#e67e80"
success = "#a7c080"
warning = "#dbbc7f"
white = "#d3c6aa"
yellow = "#dbbc7f"

[php]
format = "[$symbol $version](grey1) "
symbol = ""

[rust]
format = "[$symbol $version](grey1) "
symbol = ""
